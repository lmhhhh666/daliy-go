name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译所需 SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      - name: 准备 Android 原生工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: 写入 Android SDK 路径
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk personal-schedule.apk

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 个人课表计划-APK
          path: personal-schedule.apk
          if-no-files-found: error
          retention-days: 90
